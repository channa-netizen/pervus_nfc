<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090812">
<meta name="robots" content="noindex,nofollow">
<title>Pervus Control Room</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="shell control-shell">
  <header class="control-head">
    <div class="found">AUTHORIZED NERVOUS PERSONNEL ONLY</div>
    <h1 class="page-title gradient">PERVUS<br>CONTROL ROOM</h1>
    <p class="intro">Review incoming photographic evidence without touching the Supabase dashboard.</p>
  </header>

  <section id="loginView" class="panel auth-panel">
    <div class="lock">🔐</div>
    <h2>ADMIN SIGN IN</h2>
    <form id="loginForm">
      <label for="email">EMAIL</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">PASSWORD</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="submit" id="loginBtn" type="submit">ENTER CONTROL ROOM</button>
      <div class="status" id="loginStatus"></div>
    </form>
  </section>

  <section id="adminView" hidden>
    <div class="admin-bar">
      <div><strong>CONTROL ROOM ONLINE</strong><small id="adminEmail"></small></div>
      <button id="logoutBtn">SIGN OUT</button>
    </div>
    <div class="queue-head"><strong id="queueCount">CHECKING QUEUE...</strong><button id="refreshBtn">↻ REFRESH</button></div>
    <section id="queue" class="queue"></section>
  </section>
</main>

<div class="confirm-sheet" id="confirmSheet" hidden>
  <div class="confirm-box">
    <h3 id="confirmTitle"></h3><p id="confirmText"></p>
    <div class="confirm-actions"><button id="cancelAction">CANCEL</button><button id="confirmAction"></button></div>
  </div>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
